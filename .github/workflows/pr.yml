name: Pull request

# Every pull request against main is checked and gets a preview site of its own: the title has to be a conventional
# commit, because pull requests are squash merged with their title as the commit message and release-please builds
# the changelog from those; the tests run; and the build is deployed to the pull request's own preview environment,
# whose URL the Azure Static Web Apps action comments on the pull request. Closing it removes the preview. Production
# is never deployed from here, only from a release tag (see deploy.yml).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

# A newer push cancels the build still running for the last one; a title edit only reruns the title check.
concurrency:
  group: pr-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && 'title' || 'build' }}
  cancel-in-progress: true

jobs:
  title:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check that the title is a conventional commit
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_and_preview:
    if: github.event.action != 'closed' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test Exuarch.Core.Tests

      # A preview is the last release's version marked with its pull request, such as 1.1.0-pr.22.
      - name: Version
        run: echo "VERSION=$(jq -r '."."' .release-please-manifest.json)-pr.${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"

      - name: Publish
        run: dotnet publish Exuarch.Web -c Release -o publish -p:Version="$VERSION"

      # The app is built above, so the action only uploads the static files. On a pull request it deploys to
      # that pull request's preview environment, never to production.
      - name: Deploy the preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: publish/wwwroot
          skip_app_build: true

  close_preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Remove the preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: ""
