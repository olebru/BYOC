name: Release

# release-please reads the conventional commits that land on main and keeps a release pull request open with the next
# version and the changelog. Merging that pull request tags the release (v1.2.3) and creates the GitHub release, and
# the release is then deployed to production. A tag made with the workflow's own token does not start other workflows,
# so the deploy is called from here rather than left to the tag.
on:
  push:
    branches: [main]

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Writing contents tags the release; writing pull requests keeps the release pull request up to date.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
