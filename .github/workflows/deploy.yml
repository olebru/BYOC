name: Build, test and deploy

# main deploys to production. Every pull request against main gets its own preview environment, and the Azure
# Static Web Apps action comments its URL on the pull request; closing the pull request removes the preview.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test Exuarch.Core.Tests

      # Every published build gets a version from the run number; a pull request's preview says which pull request.
      - name: Version
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "VERSION=1.0.${{ github.run_number }}-pr.${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Publish
        run: dotnet publish Exuarch.Web -c Release -o publish -p:Version="$VERSION"

      # The app is built above, so the action only uploads the static files. On a pull request it deploys to
      # that pull request's preview environment instead of production.
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: publish/wwwroot
          skip_app_build: true
          skip_api_build: true

  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Remove the preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: ""
