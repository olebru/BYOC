name: Deploy a release

# Production (www.exuarch.com) is only ever deployed from a release tag: called by the release workflow when
# release-please tags a release, when a v* tag is pushed by hand, or run by hand for a tag that already exists.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to deploy, such as v1.2.3
        required: true
        type: string
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to deploy, such as v1.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check that it is a release tag
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::'$TAG' is not a release tag such as v1.2.3"; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test Exuarch.Core.Tests

      # The build carries the release's version, shown in the app's footer.
      - name: Publish
        run: dotnet publish Exuarch.Web -c Release -o publish -p:Version="${TAG#v}"

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: publish/wwwroot
          skip_app_build: true
